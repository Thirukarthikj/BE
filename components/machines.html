    <!-- =================================================================
         MACHINE-SPECIFIC SECTION
         Parts for the Machines You Depend On - 4 Large Visual Cards
         ================================================================= -->
    <section class="section bg-alt" style="border-bottom: 1px solid var(--color-border);">
      <div class="container">
        
        <div class="section-header text-center">
          <h2 class="section-title">Parts for the Machines You Depend On</h2>
        </div>

        <div class="machine-types-grid">
          
          <!-- Card 1: OFFSET PRINTING -->
          <div class="machine-type-card" onclick="selectMachineType('Offset Printing', 'Mitsubishi / Komori / Ryobi / Heidelberg')">
            <img class="machine-type-img" alt="Offset Printing Machine" src="images/kba_blanket_wash.jpg"/>
            <div class="machine-type-overlay">
              <h3 class="machine-type-title">OFFSET PRINTING</h3>
              <p class="machine-type-brands">Mitsubishi / Komori / Ryobi / Heidelberg</p>
            </div>
          </div>

          <!-- Card 2: FOLDING MACHINES -->
          <div class="machine-type-card" onclick="selectMachineType('Folding Machines', 'Shoei / Stahl / MBO / Muller Martini')">
            <img class="machine-type-img" alt="Folding Machinery" src="images/shoei_spiral_roller.jpg"/>
            <div class="machine-type-overlay">
              <h3 class="machine-type-title">FOLDING MACHINES</h3>
              <p class="machine-type-brands">Shoei / Stahl / MBO / Muller Martini</p>
            </div>
          </div>

          <!-- Card 3: CUTTING MACHINES -->
          <div class="machine-type-card" onclick="selectMachineType('Cutting Machines', 'Industrial Cutting Equipment')">
            <img class="machine-type-img" alt="Cutting Machinery" src="images/kolbus_trimmer_knife.jpg"/>
            <div class="machine-type-overlay">
              <h3 class="machine-type-title">CUTTING MACHINES</h3>
              <p class="machine-type-brands">Industrial cutting machine components</p>
            </div>
          </div>

          <!-- Card 4: SPECIALIZED MACHINERY -->
          <div class="machine-type-card" onclick="selectMachineType('Specialized Machinery', 'Akiyama / Sakurai / Shinohara / KBA / Roland / Kolbus / Aster')">
            <img class="machine-type-img" alt="Specialized Finishing Machinery" src="images/muller_stitching_head.jpg"/>
            <div class="machine-type-overlay">
              <h3 class="machine-type-title">SPECIALIZED MACHINERY</h3>
              <p class="machine-type-brands">Akiyama / Sakurai / Shinohara / KBA / Roland / Kolbus / Aster</p>
            </div>
          </div>

        </div>

      </div>
    </section>
